<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAT Dashboard</title><style>body{font-family:system-ui;margin:2rem;max-width:1100px}button{padding:.7rem 1rem}pre{white-space:pre-wrap;background:#f5f5f5;padding:1rem;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.card{border:1px solid #ddd;padding:1rem;border-radius:8px}</style></head><body><h1>Cyber Attack Tracker</h1><p>Defensive incident investigation dashboard.</p><button id="demo">Run synthetic demo</button><div id="summary" class="grid"></div><h2>Incident evidence</h2><pre id="out">No analysis yet.</pre><script>document.getElementById('demo').onclick=async()=>{const r=await fetch('/api/v1/demo',{method:'POST'});const d=await r.json();const i=d.incidents[0];document.getElementById('summary').innerHTML=i?[`<div class="card"><b>Risk</b><br>${i.risk.score} / 100</div>`,`<div class="card"><b>Level</b><br>${i.risk.level}</div>`,`<div class="card"><b>Detections</b><br>${i.detections.length}</div>`,`<div class="card"><b>Graph nodes</b><br>${i.attack_graph.nodes.length}</div>`].join(''): '<div class="card">No incidents</div>';document.getElementById('out').textContent=JSON.stringify(d,null,2)}</script></body></html>
