services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cat
      POSTGRES_USER: cat
      POSTGRES_PASSWORD: cat_dev_only
    ports:
      - "5432:5432"
    volumes:
      - cat-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://cat:cat_dev_only@postgres:5432/cat
    ports:
      - "8000:8000"

volumes:
  cat-postgres:
